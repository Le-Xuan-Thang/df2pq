# Build with: VERSION=0.1.0 nfpm package -p deb|rpm -f packaging/linux/nfpm.yaml
# Expects the PyInstaller output in dist/df2pq.
name: df2pq
arch: amd64
platform: linux
version: ${VERSION}
section: utils
maintainer: Le-Xuan-Thang <lexuanthang.official@outlook.com>
description: Batch converter for CSV, Parquet, Feather, JSON, ORC and Excel files.
homepage: https://github.com/Le-Xuan-Thang/df2pq
license: MIT
contents:
  - src: dist/df2pq/
    dst: /opt/df2pq/
    type: tree
  - src: /opt/df2pq/df2pq
    dst: /usr/bin/df2pq
    type: symlink
  - src: packaging/linux/df2pq.desktop
    dst: /usr/share/applications/df2pq.desktop
  - src: LICENSE
    dst: /usr/share/doc/df2pq/LICENSE
