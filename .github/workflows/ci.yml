name: Tests and portable builds

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests -v

  build:
    name: Portable build · ${{ matrix.target }}
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64
          - os: windows-latest
            target: windows-x86_64
          - os: macos-15-intel
            target: macos-x86_64
          - os: macos-latest
            target: macos-arm64
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra packaging --extra excel
      - name: Build application bundle
        run: uv run df2pq-build

      - name: Archive Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/df2pq -DestinationPath df2pq-windows-x86_64.zip
      - name: Archive macOS bundle
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/df2pq.app df2pq-${{ matrix.target }}.zip
      - name: Archive Linux bundle
        if: runner.os == 'Linux'
        run: tar -czf df2pq-linux-x86_64.tar.gz -C dist df2pq

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\windows\df2pq.iss
      - name: Build Linux .deb and .rpm
        if: runner.os == 'Linux'
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          curl -fsSL https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz | tar -xz nfpm
          for fmt in deb rpm; do
            VERSION=$VERSION ./nfpm package -p $fmt -f packaging/linux/nfpm.yaml -t .
          done

      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: df2pq-windows-x86_64
          path: |
            df2pq-windows-x86_64.zip
            df2pq-windows-x86_64-setup.exe
          if-no-files-found: error
      - name: Upload macOS build
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: df2pq-${{ matrix.target }}
          path: df2pq-${{ matrix.target }}.zip
          if-no-files-found: error
      - name: Upload Linux build
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: df2pq-linux-x86_64
          path: |
            df2pq-linux-x86_64.tar.gz
            *.deb
            *.rpm
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: df2pq-*
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v3.0.3
        with:
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
