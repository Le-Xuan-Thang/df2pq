name: Tests and portable builds

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests -v

  build:
    name: Portable build · ${{ matrix.target }}
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64
          - os: windows-latest
            target: windows-x86_64
          - os: macos-latest
            target: macos
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --locked --extra packaging --extra excel
      - name: Build application bundle
        run: uv run df2pq-build

      - name: Archive Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/df2pq -DestinationPath df2pq-windows-x86_64.zip
      - name: Archive macOS bundle
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/df2pq.app df2pq-macos.zip
      - name: Archive Linux bundle
        if: runner.os == 'Linux'
        run: tar -czf df2pq-linux-x86_64.tar.gz -C dist df2pq

      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: df2pq-windows-x86_64
          path: df2pq-windows-x86_64.zip
          if-no-files-found: error
      - name: Upload macOS build
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: df2pq-macos
          path: df2pq-macos.zip
          if-no-files-found: error
      - name: Upload Linux build
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: df2pq-linux-x86_64
          path: df2pq-linux-x86_64.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: df2pq-*
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
