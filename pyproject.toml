[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "df2pq"
version = "0.1.0"
description = "A desktop and batch converter for tabular data files."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "nicegui>=3.18.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1", "xlrd>=2.0.1"]
gpu-cu13 = ["cudf-cu13>=26.10.0; python_version >= '3.11'"]
packaging = ["pyinstaller>=6.0"]

[project.urls]
Homepage = "https://github.com/Le-Xuan-Thang/df2pq"
Repository = "https://github.com/Le-Xuan-Thang/df2pq"
Issues = "https://github.com/Le-Xuan-Thang/df2pq/issues"

[project.scripts]
df2pq = "df2pq.web:main"
df2pq-tk = "df2pq.app:main"
df2pq-convert = "df2pq.converter:main"
df2pq-headerless-csv = "convert_headerless_csv_to_parquet:main"
df2pq-check = "check_parquet:main"
df2pq-build = "build_portable:main"

[tool.setuptools]
packages = ["df2pq"]
py-modules = [
    "build_gui",
    "build_portable",
    "check_parquet",
    "convert_csv_to_parquet",
    "convert_headerless_csv_to_parquet",
]
